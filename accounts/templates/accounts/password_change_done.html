
{% extends "base.html" %}

{% block title %}Password Updated | FindIt{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">
            <span class="section-label">ACCOUNT SECURITY</span>
            <h1>Password Successfully Changed</h1>
            <p>Your account password has been updated successfully.</p>
        </div>

        <div class="registration-notice">
            <strong>Security updated</strong>
            <p>Your new password is now active.</p>
        </div>

        <a href="{% url 'dashboard' %}" class="button button-primary auth-submit">
            Return to Dashboard
        </a>

    </div>

</div>

{% endblock %}
